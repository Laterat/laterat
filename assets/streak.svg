<svg
  width="720"
  height="190"
  viewBox="0 0 720 190"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="GitHub contribution streak for Laterat"
>

  <defs>
    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="720"
      y2="0"
    >
      <stop
        offset="0%"
        stop-color="#ff4500"
      />
      <stop
        offset="100%"
        stop-color="#ff6a33"
      />
    </linearGradient>

    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="6"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>


  <!-- Card -->

  <rect
    x="0.5"
    y="0.5"
    width="719"
    height="189"
    rx="14"
    fill="#0d1117"
    stroke="#30363d"
  />


  <!-- Accent -->

  <rect
    x="0"
    y="0"
    width="720"
    height="3"
    rx="2"
    fill="url(#accent)"
  />


  <!-- Header -->

  <text
    x="32"
    y="42"
    fill="#f0f6fc"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="18"
    font-weight="600"
  >
    GitHub activity
  </text>

  <text
    x="32"
    y="65"
    fill="#8b949e"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
  >
    @Laterat
  </text>


  <!-- Current streak -->

  <text
    x="32"
    y="111"
    fill="#ff4500"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="32"
    font-weight="700"
    filter="url(#glow)"
  >
    13
  </text>

  <text
    x="32"
    y="134"
    fill="#c9d1d9"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    font-weight="500"
  >
    CURRENT STREAK
  </text>


  <!-- Divider -->

  <line
    x1="240"
    y1="82"
    x2="240"
    y2="151"
    stroke="#30363d"
  />


  <!-- Longest streak -->

  <text
    x="272"
    y="111"
    fill="#f0f6fc"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="32"
    font-weight="700"
  >
    16
  </text>

  <text
    x="272"
    y="134"
    fill="#c9d1d9"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    font-weight="500"
  >
    LONGEST STREAK
  </text>


  <!-- Divider -->

  <line
    x1="480"
    y1="82"
    x2="480"
    y2="151"
    stroke="#30363d"
  />


  <!-- Contributions -->

  <text
    x="512"
    y="111"
    fill="#f0f6fc"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="32"
    font-weight="700"
  >
    909
  </text>

  <text
    x="512"
    y="134"
    fill="#c9d1d9"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    font-weight="500"
  >
    CONTRIBUTIONS
  </text>


  <!-- Footer -->

  <line
    x1="32"
    y1="158"
    x2="688"
    y2="158"
    stroke="#21262d"
  />

  <circle
    cx="36"
    cy="174"
    r="3"
    fill="#ff4500"
  />

  <text
    x="48"
    y="178"
    fill="#6e7681"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="10"
  >
    Updated automatically
  </text>

</svg>
