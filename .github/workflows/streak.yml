name: Update GitHub Streak

on:
  push:
    branches:
      - main

  schedule:
    - cron: "15 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate streak and generate SVG
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          GITHUB_USERNAME: Laterat
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import date, datetime, timedelta, timezone

          token = os.environ["GH_TOKEN"]
          username = os.environ["GITHUB_USERNAME"]

          # Start of the contribution history shown by your
          # previous Streak Stats card.
          START_DATE = date(2024, 11, 2)

          today = date.today()

          query = """
          query(
            $login: String!,
            $from: DateTime!,
            $to: DateTime!
          ) {
            user(login: $login) {
              contributionsCollection(
                from: $from
                to: $to
              ) {
                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          def fetch_period(start_date, end_date):
              """
              GitHub allows a maximum of one year per
              contributionsCollection query.
              """

              from_datetime = (
                  f"{start_date.isoformat()}T00:00:00Z"
              )

              to_datetime = (
                  f"{end_date.isoformat()}T23:59:59Z"
              )

              payload = json.dumps({
                  "query": query,
                  "variables": {
                      "login": username,
                      "from": from_datetime,
                      "to": to_datetime
                  }
              }).encode()

              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "Laterat-GitHub-Streak"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  result = json.load(response)

              if "errors" in result:
                  raise RuntimeError(
                      f"GitHub GraphQL error: {result['errors']}"
                  )

              user = result["data"]["user"]

              if not user:
                  raise RuntimeError(
                      f"GitHub user '{username}' was not found."
                  )

              return (
                  user["contributionsCollection"]
                  ["contributionCalendar"]
              )


          # ---------------------------------------------------------
          # Fetch the entire history in <= 1-year chunks
          # ---------------------------------------------------------

          contributions = {}
          total_contributions = 0

          period_start = START_DATE

          while period_start <= today:

              # 364 days gives us a safe margin under GitHub's
              # one-year maximum.
              period_end = min(
                  period_start + timedelta(days=364),
                  today
              )

              print(
                  f"Fetching {period_start} → {period_end}"
              )

              calendar = fetch_period(
                  period_start,
                  period_end
              )

              total_contributions += (
                  calendar["totalContributions"]
              )

              for week in calendar["weeks"]:
                  for contribution_day in week["contributionDays"]:

                      contribution_date = date.fromisoformat(
                          contribution_day["date"]
                      )

                      contributions[contribution_date] = (
                          contribution_day["contributionCount"]
                      )

              # Move to the next day so periods never overlap.
              period_start = (
                  period_end + timedelta(days=1)
              )


          # ---------------------------------------------------------
          # Current streak
          # ---------------------------------------------------------

          if contributions.get(today, 0) > 0:
              cursor = today
          else:
              cursor = today - timedelta(days=1)

          current_streak = 0

          while contributions.get(cursor, 0) > 0:
              current_streak += 1
              cursor -= timedelta(days=1)


          # ---------------------------------------------------------
          # Longest streak
          # ---------------------------------------------------------

          longest_streak = 0
          running_streak = 0

          for contribution_date in sorted(contributions):

              if contributions[contribution_date] > 0:
                  running_streak += 1

                  longest_streak = max(
                      longest_streak,
                      running_streak
                  )

              else:
                  running_streak = 0


          # ---------------------------------------------------------
          # Generate SVG
          # ---------------------------------------------------------

          svg = f'''<svg
            width="720"
            height="190"
            viewBox="0 0 720 190"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="GitHub contribution streak for {username}"
          >

            <defs>
              <linearGradient
                id="accent"
                x1="0"
                y1="0"
                x2="720"
                y2="0"
              >
                <stop
                  offset="0%"
                  stop-color="#ff4500"
                />
                <stop
                  offset="100%"
                  stop-color="#ff6a33"
                />
              </linearGradient>

              <filter
                id="glow"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%"
              >
                <feGaussianBlur
                  stdDeviation="6"
                  result="blur"
                />

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>


            <!-- Card -->

            <rect
              x="0.5"
              y="0.5"
              width="719"
              height="189"
              rx="14"
              fill="#0d1117"
              stroke="#30363d"
            />


            <!-- Accent -->

            <rect
              x="0"
              y="0"
              width="720"
              height="3"
              rx="2"
              fill="url(#accent)"
            />


            <!-- Header -->

            <text
              x="32"
              y="42"
              fill="#f0f6fc"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18"
              font-weight="600"
            >
              GitHub activity
            </text>

            <text
              x="32"
              y="65"
              fill="#8b949e"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12"
            >
              @{username}
            </text>


            <!-- Current streak -->

            <text
              x="32"
              y="111"
              fill="#ff4500"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="32"
              font-weight="700"
              filter="url(#glow)"
            >
              {current_streak}
            </text>

            <text
              x="32"
              y="134"
              fill="#c9d1d9"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12"
              font-weight="500"
            >
              CURRENT STREAK
            </text>


            <!-- Divider -->

            <line
              x1="240"
              y1="82"
              x2="240"
              y2="151"
              stroke="#30363d"
            />


            <!-- Longest streak -->

            <text
              x="272"
              y="111"
              fill="#f0f6fc"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="32"
              font-weight="700"
            >
              {longest_streak}
            </text>

            <text
              x="272"
              y="134"
              fill="#c9d1d9"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12"
              font-weight="500"
            >
              LONGEST STREAK
            </text>


            <!-- Divider -->

            <line
              x1="480"
              y1="82"
              x2="480"
              y2="151"
              stroke="#30363d"
            />


            <!-- Contributions -->

            <text
              x="512"
              y="111"
              fill="#f0f6fc"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="32"
              font-weight="700"
            >
              {total_contributions}
            </text>

            <text
              x="512"
              y="134"
              fill="#c9d1d9"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12"
              font-weight="500"
            >
              CONTRIBUTIONS
            </text>


            <!-- Footer -->

            <line
              x1="32"
              y1="158"
              x2="688"
              y2="158"
              stroke="#21262d"
            />

            <circle
              cx="36"
              cy="174"
              r="3"
              fill="#ff4500"
            />

            <text
              x="48"
              y="178"
              fill="#6e7681"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="10"
            >
              Updated automatically
            </text>

          </svg>
          '''

          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/streak.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)


          # ---------------------------------------------------------
          # Output
          # ---------------------------------------------------------

          print("")
          print("========================================")
          print("GitHub Streak")
          print("========================================")
          print(f"Current streak:      {current_streak}")
          print(f"Longest streak:      {longest_streak}")
          print(f"Total contributions: {total_contributions}")
          print(
              f"Period:              "
              f"{START_DATE} → {today}"
          )
          print("========================================")
          print("")
          PY

      - name: Commit updated streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/streak.svg

          if git diff --cached --quiet; then
            echo "No streak changes."
          else
            git commit -m "chore: update GitHub streak"
            git push
          fi
