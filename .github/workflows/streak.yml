name: Update GitHub Streak

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate streak and generate SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Laterat
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from datetime import date, timedelta

          token = os.environ["GH_TOKEN"]
          username = os.environ["GITHUB_USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "Laterat-GitHub-Streak"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if "errors" in result:
              raise RuntimeError(
                  f"GitHub GraphQL error: {result['errors']}"
              )

          user = result["data"]["user"]

          if not user:
              raise RuntimeError(
                  f"GitHub user '{username}' was not found."
              )

          calendar = (
              user["contributionsCollection"]
              ["contributionCalendar"]
          )

          contributions = {}

          for week in calendar["weeks"]:
              for contribution_day in week["contributionDays"]:
                  contribution_date = date.fromisoformat(
                      contribution_day["date"]
                  )

                  contributions[contribution_date] = (
                      contribution_day["contributionCount"]
                  )

          today = date.today()

          # ---------------------------------------------------------
          # Current streak
          #
          # If today has no contribution yet, start from yesterday.
          # This prevents the daily workflow from incorrectly showing
          # 0 while the previous day's streak is still active.
          # ---------------------------------------------------------

          if contributions.get(today, 0) > 0:
              cursor = today
          else:
              cursor = today - timedelta(days=1)

          current_streak = 0

          while contributions.get(cursor, 0) > 0:
              current_streak += 1
              cursor -= timedelta(days=1)

          # ---------------------------------------------------------
          # Longest streak
          # ---------------------------------------------------------

          longest_streak = 0
          running_streak = 0

          for contribution_date in sorted(contributions):
              if contributions[contribution_date] > 0:
                  running_streak += 1
                  longest_streak = max(
                      longest_streak,
                      running_streak
                  )
              else:
                  running_streak = 0

          total = calendar["totalContributions"]

          # ---------------------------------------------------------
          # SVG
          # ---------------------------------------------------------

          svg = f'''<svg
            width="720"
            height="190"
            viewBox="0 0 720 190"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="GitHub contribution streak for {username}"
          >

            <defs>
              <linearGradient
                id="accent"
                x1="0"
                y1="0"
                x2="720"
                y2="0"
              >
                <stop offset="0%" stop-color="#ff4500"/>
                <stop offset="100%" stop-color="#ff6a33"/>
              </linearGradient>

              <filter
                id="glow"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%"
              >
                <feGaussianBlur
                  stdDeviation="6"
                  result="blur"
                />
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- Background -->
            <rect
              x="0.5"
              y="0.5"
              width="719"
              height="189"
              rx="14"
              fill="#0d1117"
              stroke="#30363d"
            />

            <!-- Accent line -->
            <rect
              x="0"
              y="0"
              width="720"
              height="3"
              rx="2"
              fill="url(#accent)"
            />

            <!-- Header -->
            <text
              x="32"
              y="42"
              fill="#f0f6fc"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="18"
              font-weight="600"
              letter-spacing="-0.2"
            >
              GitHub activity
            </text>

            <text
              x="32"
              y="65"
              fill="#8b949e"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12"
            >
              @{username}
            </text>

            <!-- Current streak -->
            <text
              x="32"
              y="111"
              fill="#ff4500"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="32"
              font-weight="700"
              letter-spacing="-1"
              filter="url(#glow)"
            >
              {current_streak}
            </text>

            <text
              x="32"
              y="134"
              fill="#c9d1d9"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12"
              font-weight="500"
            >
              CURRENT STREAK
            </text>

            <!-- Divider -->
            <line
              x1="240"
              y1="82"
              x2="240"
              y2="151"
              stroke="#30363d"
            />

            <!-- Longest streak -->
            <text
              x="272"
              y="111"
              fill="#f0f6fc"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="32"
              font-weight="700"
              letter-spacing="-1"
            >
              {longest_streak}
            </text>

            <text
              x="272"
              y="134"
              fill="#c9d1d9"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12"
              font-weight="500"
            >
              LONGEST STREAK
            </text>

            <!-- Divider -->
            <line
              x1="480"
              y1="82"
              x2="480"
              y2="151"
              stroke="#30363d"
            />

            <!-- Total contributions -->
            <text
              x="512"
              y="111"
              fill="#f0f6fc"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="32"
              font-weight="700"
              letter-spacing="-1"
            >
              {total}
            </text>

            <text
              x="512"
              y="134"
              fill="#c9d1d9"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12"
              font-weight="500"
            >
              CONTRIBUTIONS
            </text>

            <!-- Footer -->
            <line
              x1="32"
              y1="158"
              x2="688"
              y2="158"
              stroke="#21262d"
            />

            <circle
              cx="36"
              cy="174"
              r="3"
              fill="#ff4500"
            />

            <text
              x="48"
              y="178"
              fill="#6e7681"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="10"
            >
              Updated daily
            </text>

            <text
              x="688"
              y="178"
              text-anchor="end"
              fill="#6e7681"
              font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="10"
            >
              GitHub contributions
            </text>

          </svg>
          '''

          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/streak.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print(f"Current streak: {current_streak}")
          print(f"Longest streak: {longest_streak}")
          print(f"Total contributions: {total}")
          PY

      - name: Commit updated streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/streak.svg

          if git diff --cached --quiet; then
            echo "No streak changes."
          else
            git commit -m "chore: update GitHub streak"
            git push
          fi
